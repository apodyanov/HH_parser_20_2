[tool.poetry]
name = "hh-parser"
version = "1.0.0"
description = "Course work: HH.ru vacancies parser"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.31.0"
psycopg2-binary = "^2.9.9"
